name: Build aTrust RPM

# 版本来源：仓库根目录的 version 文件（单行，内容为 aTrust .deb 的下载地址）。
# 行为：
#   - push 到 main/master 且 version 文件有变化 -> 构建
#   - 手动触发（可勾选 force_release 强制重发）
#   - 下载后统一命名为 aTrustInstaller_<版本>_amd64.deb
#   - 构建出的版本若已有对应 Release(v<版本>) 则只出 artifact，不重复发布；
#     版本变化才创建新 Release。
on:
  workflow_dispatch:
    inputs:
      force_release:
        description: "版本已存在时也强制重新发布 Release"
        type: boolean
        default: false
      fedora_image:
        description: "构建镜像（默认 fedora:latest；如需 fc45 可填 fedora:rawhide）"
        type: string
        default: "fedora:latest"
      dist_tag:
        description: "发布标签，如 .fc45；none=去掉标签(发行版无关)；留空=用镜像默认"
        type: string
        default: ""
  push:
    branches: [ main, master ]
    paths: [ "version" ]

permissions:
  contents: write

concurrency:
  group: build-rpm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.fedora_image || 'fedora:latest' }}
    steps:
      - name: 安装构建依赖
        run: |
          dnf install -y rpm-build binutils xz curl tar gzip git git-lfs findutils patchelf

      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 显示 version 配置
        run: |
          echo "version 文件内容:"; cat version

      - name: 检查打包文件是否齐全
        run: |
          set -euo pipefail
          echo "工作目录: $PWD"
          echo "--- 仓库根目录 ---"
          ls -la
          echo "--- rpm-packaging 实际文件 ---"
          find rpm-packaging -type f -print || true
          need="
          rpm-packaging/SPECS/cn.com.sangfor.atrust.spec
          rpm-packaging/helpers/cn.com.sangfor.atrust.common
          rpm-packaging/helpers/cn.com.sangfor.atrust.create_dir
          rpm-packaging/helpers/cn.com.sangfor.atrust.postinst
          rpm-packaging/helpers/cn.com.sangfor.atrust.prerm
          "
          miss=0
          for f in $need; do
            if [ ! -s "$f" ]; then echo "::error::缺少文件: $f"; miss=1; fi
          done
          [ "$miss" = 0 ] || { echo "::error::仓库缺少打包文件（helpers/spec），请确认已提交并推送。"; exit 1; }
          echo "打包文件齐全。"

      - name: 构建 RPM（自动读取 version 并下载 deb）
        env:
          ATRUST_DIST: ${{ inputs.dist_tag }}
        run: |
          chmod +x build-rpm.sh
          ./build-rpm.sh

      - name: 读取产物信息
        id: meta
        run: |
          set -euo pipefail
          echo "version=$(cat dist/VERSION)" >> "$GITHUB_OUTPUT"
          echo "arch=$(cat dist/ARCH)"       >> "$GITHUB_OUTPUT"
          echo "构建版本: $(cat dist/VERSION) ($(cat dist/ARCH))"
          ls -l dist

      - name: 检查该版本 Release 是否已存在
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.meta.outputs.version }}"
          CODE="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG}")"
          if [ "$CODE" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::版本 ${TAG} 已存在 Release，本次仅构建产物、不重复发布"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::将发布新 Release ${TAG}"
          fi

      - name: 依赖校验（安装文件但不执行脚本）
        run: |
          RPM="$(ls dist/*.rpm | grep -v '\.src\.rpm' | head -1)"
          echo "校验: $RPM"
          dnf install -y --setopt=tsflags=noscripts --setopt=install_weak_deps=False "$RPM"
          rpm -q cn.com.sangfor.atrust
          echo "文件数: $(rpm -ql cn.com.sangfor.atrust | wc -l)"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: atrust-rpm-${{ steps.meta.outputs.version }}
          path: |
            dist/*.rpm
            dist/*.deb
            dist/SHA256SUMS.txt
            dist/VERSION
            dist/ARCH
          if-no-files-found: error
          compression-level: 0

      - name: 发布 Release（版本变化时）
        if: ${{ steps.rel.outputs.exists == 'false' || inputs.force_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: aTrust ${{ steps.meta.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.rpm
            dist/*.deb
            dist/SHA256SUMS.txt
